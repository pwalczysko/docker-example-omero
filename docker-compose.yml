version: "3"

services:

  database:
    image: "postgres:16"
    environment:
      POSTGRES_USER: omero
      POSTGRES_DB: omero
      POSTGRES_PASSWORD: omero
    networks:
      - omero
    volumes:
      - "database:/Users/pwalczysko/var/omero/lib/postgresql/data"

  omeroserver:
    # This container uses the tag for the latest server release of OMERO 5
    # To upgrade to the next major release, increment the major version number
    image: "pwalczysko/omero-server-aarch64:5.6.18-10"
    environment:
      CONFIG_omero_db_host: database
      CONFIG_omero_db_user: omero
      CONFIG_omero_db_pass: omero
      CONFIG_omero_db_name: omero
      CONFIG_omero_server_nodedescriptors: >-
        master:Blitz-0,Processor-0,Tables-0,Indexer-0,DropBox,MonitorServer,FileServer,Storm
      ROOTPASS: omero
    networks:
      - omero
    ports:
      - "4063:4063"
      - "4064:4064"
    volumes:
      - "/Users/pwalczysko/Work/openmicroscopy/components/tools/OmeroPy/OMERO:/OMERO"
      - "/Users/pwalczysko/Work/openmicroscopy:/openmicroscopy"

  omeroweb:
    # This container uses the tag for the latest web release of OMERO 5
    # To upgrade to the next major release, increment the major version number
    platform: linux/x86_64
    image: "openmicroscopy/omero-web-standalone:5"
    environment:
      OMEROHOST: omeroserver
    networks:
      - omero
    ports:
      - "4080:4080"
    volumes:
      - "/Users/pwalczysko/Work/openmicroscopy:/openmicroscopy"

networks:
  omero:

volumes:
  database:
  omero:
